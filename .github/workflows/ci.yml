name: R checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - uses: r-lib/actions/setup-renv@v2
      - name: Parse canonical script
        run: Rscript -e "parse(file = 'scripts/replicate_tables.R')"
      - name: Run checks
        run: Rscript tests/test_replication.R
